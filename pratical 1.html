<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pratical no 1</title>
    <style>
        
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #4facfe, #00f2fe);
}


.header {
    text-align: center;
    padding: 20px;
    background-color: #ffffff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.header h1 {
    margin: 0;
    color: #333;
}


.content {
    width: 300px;
    margin: 50px auto;
    padding: 25px;
    background-color: #ffffff;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    text-align: center;
}


.content label {
    font-size: 16px;
    color: #555;
}

.content input {
    width: 80%;
    padding: 8px;
    margin-top: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}


.content button {
    margin-top: 15px;
    padding: 10px 20px;
    background-color: #4facfe;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;
}


.content button:hover {
    background-color: #0d73df;
}


#largestNo {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    color: #333;
}
    </style>
</head>
<body>
    <div class=" header">
        <h1>largest number finder</h1>
        
    </div>
     <div class="content">
        <label>Enter the number of input no</label>
        <input type="number" id="numbercount"><BR><br>
            <button  type="button" onclick="largnofinder()">larger no finder</button>
        <div id="largest no "></div> 
    </div>

<script src="pratical.jsx"></script>
    
</body>
</html>
