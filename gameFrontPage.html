<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA V</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Montserrat',sans-serif;
}

body{
    background:#000;
    color:#fff;
    overflow:hidden;
}

/* ================= NAVBAR ================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:25px 80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;
    backdrop-filter: blur(8px);
    background:rgba(0,0,0,0.5);
    border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
    font-weight:900;
    font-size:22px;
    letter-spacing:3px;
}

.menu{
    display:flex;
    gap:40px;
    align-items:center;
}

.menu a{
    text-decoration:none;
    color:#ccc;
    font-size:14px;
    position:relative;
    transition:0.3s;
}

/* Underline hover animation */
.menu a::after{
    content:"";
    position:absolute;
    bottom:-6px;
    left:0;
    width:0%;
    height:2px;
    background:#2ecc71;
    transition:0.3s;
}

.menu a:hover{
    color:#fff;
}

.menu a:hover::after{
    width:100%;
}

.cta{
    background:#2ecc71;
    color:#000;
    padding:10px 22px;
    border-radius:4px;
    font-weight:700;
}

/* ================= HERO ================= */

.hero{
    position:relative;
    height:100vh;
    width:100%;
    overflow:hidden;
    display:flex;
    align-items:center;
}

/* Background Image */
.hero img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    animation:slowZoom 25s ease-in-out infinite alternate;
}

/* Dark overlay */
.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to right, rgba(0,0,0,0.85) 20%, rgba(0,0,0,0.3) 60%);
}

/* ================= HERO CONTENT ================= */

.hero-content{
    position:relative;
    z-index:5;
    max-width:600px;
    margin-left:100px;
}

.hero-content h1{
    font-size:56px;
    font-weight:900;
    margin-bottom:20px;
    line-height:1.1;
}

.hero-content p{
    font-size:16px;
    color:#ccc;
    line-height:1.6;
    margin-bottom:30px;
}

/* Buttons */
.buttons{
    display:flex;
    gap:20px;
}

.primary-btn{
    padding:14px 30px;
    border:none;
    background:#2ecc71;
    color:#000;
    font-weight:700;
    border-radius:4px;
    cursor:pointer;
    transition:0.3s;
}

.primary-btn:hover{
    background:#27ae60;
}

.secondary-btn{
    padding:14px 30px;
    border:2px solid #fff;
    background:transparent;
    color:#fff;
    font-weight:600;
    border-radius:4px;
    cursor:pointer;
    transition:0.3s;
}

.secondary-btn:hover{
    background:#fff;
    color:#000;
}

/* Scroll indicator */
.scroll{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    letter-spacing:2px;
    color:#aaa;
    animation:fade 2s infinite;
}

@keyframes fade{
    0%,100%{opacity:0.2;}
    50%{opacity:1;}
}

/* Zoom animation */
@keyframes slowZoom{
    from{transform:scale(1);}
    to{transform:scale(1.1);}
}

/* Responsive */
@media(max-width:900px){
    nav{
        padding:20px 30px;
    }
    .menu{
        display:none;
    }
    .hero-content{
        margin-left:30px;
        max-width:90%;
    }
    .hero-content h1{
        font-size:36px;
    }
}

</style>
</head>
<body>

<nav>
    <div class="logo">GTA V</div>

    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Story</a>
        <a href="#">Characters</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a> 
        <a href="#" class="cta">Download</a>
    </div>
</nav>

<section class="hero">
    <img src="GTA V hero.jpg" alt="GTA V Hero Image">

    <div class="hero-content">
        <h1>Welcome to Los Santos</h1>
        <p>
            Experience the ultimate open-world adventure in the city of dreams.
            Dive into action, crime, luxury, and chaos in one of the most iconic
            game worlds ever created.
        </p>

        <div class="buttons">
            <button class="primary-btn">Play Now</button>
            <button class="secondary-btn">Watch Trailer</button>
        </div>
    </div>

    <div class="scroll">SCROLL DOWN</div>

</section>

</body>
</html>
